[package]
name = "dm-debug-station"
version = "1.0.0"
description = "DMDebug serial protocol v2 three-bus motor workbench"
authors = ["DMDebugStation"]
edition = "2021"

[lib]
name = "dm_debug_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"
gilrs = "0.11.2"
