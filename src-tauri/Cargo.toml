[package]
name = "dm-debug-station"
version = "1.1.2"
description = "DMDebug serial protocol v2 three-bus motor workbench"
authors = ["DMDebugStation"]
edition = "2021"

[lib]
name = "dm_debug_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media_Multimedia", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }
